<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="calculator-wrapper">

        <div class="calculator">

            <h1>Calculator</h1>
            <div class="calculator-screen" id="txtarea">

                <input type="text" id="expression" placeholder="Expression" size="20">
                <br>
                <input type="text" id="answer" placeholder="Answer" size="20">

            </div>
            <br>

            <div class="buttons">

                <input class="features" type="button" value="C" onclick="clickFeatures(this)">
                <input class="features" type="button" value="⌫" onclick="clickFeatures(this)">
                <input class="features" type="button" value="◴" onclick="clickFeatureshistory()">
                <input class="math-symbol" type="button" value="÷" onclick="clickMathSymbol(this)">

                <br><br>

                <input class="number" type="button" value="7" onclick="clickNumbers(this)">
                <input class="number" type="button" value="8" onclick="clickNumbers(this)">
                <input class="number" type="button" value="9" onclick="clickNumbers(this)">
                <input class="math-symbol" type="button" value="×" onclick="clickMathSymbol(this)">

                <br><br>

                <input class="number" type="button" value="4" onclick="clickNumbers(this)">
                <input class="number" type="button" value="5" onclick="clickNumbers(this)">
                <input class="number" type="button" value="6" onclick="clickNumbers(this)">
                <input class="math-symbol" type="button" value="-" onclick="clickMathSymbol(this)">

                <br><br>

                <input class="number" type="button" value="1" onclick="clickNumbers(this)">
                <input class="number" type="button" value="2" onclick="clickNumbers(this)">
                <input class="number" type="button" value="3" onclick="clickNumbers(this)">
                <input class="math-symbol" type="button" value="+" onclick="clickMathSymbol(this)">
                
            </div>
        </div>

        <div id="lbltxt"></div>
        <div id="calculation-history"></div>
    
    </div>

    <div class="calculator-wrapper">
        <div class="getCalculationHistory">

            <h2>Calculation History</h2>

        </div>


    </div>


</body>

</html>
